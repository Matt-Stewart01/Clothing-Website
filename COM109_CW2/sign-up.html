<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <link rel="stylesheet" type="text/css" href="styles.css">
        <title>Sign-in / Register</title>
 
    </head>
    <body>
        <div class="Header">
            <h1 class="LOGO-MAIN"><b>MONO</b></h1>
        </div>

        <div id="subTitle">
            <h2>Sign-in / Register</h2>
        </div>

        <div id="Sign-Up_Form">
            <form action="input">
                <div id="title_choice">
                    <label for="title">Select title</label> <!--Turn into drop down menu-->
                    <input type="text" name="title" required>
                </div>
                
                <div id="fName">
                    <label for="firstName">First Name</label>
                    <input type="text" name="First Name" required>
                </div>
                
                <div id="lName">
                    <label for="lastName">Last Name</label>
                    <input type="text" name="Last Name" required>
                </div>
                
                <div id="sign-up_email">
                    <label for="Email">Email</label>
                    <input type="email" name="Email" required>
                </div>
        
                <div id="pass">
                    <label for="password">Password</label>
                    <input type="password" name="password" required>
                </div>
                
                <div id="DOB">
                    <label for="DOB">Date of Birth</label>
                    <input type="date" name="DOB" required>
                </div>

                <div id="con_Num">
                    <label for="Contact_Num">Contact Number</label>
                    <input type="text" name="contact" required>
                </div>

                <div id="house_No">
                    <label for="house No">House No / name</label>
                    <input type="text" name="house_No" required>
                </div>

                <div id="pCode">
                    <label for="PostCode">Postcode</label>
                    <input type="text" name="post_code" required>
                </div>

                <div id="submitBtn">
                    <button type="submit">submit</button>
                </div>

            </form>
        </div>
        
    </body>

</html>
