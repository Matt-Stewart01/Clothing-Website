<!DOCTYPE html>
<html lang="eng">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <link rel="stylesheet" type="text/css" href="styles.css">
        <link rel="icon" type="image/x-icon"  href="\COM109_CW2\Images\Mono_favicon.jpg">
        <script src="sign-up.js"></script>
        <title>Account creation</title>
 
    </head>
    
    <body>
        <div class="Header">
            <h1 class="LOGO-MAIN"><b>MONO</b></h1>
        </div>

        <nav class ="navbar">
            <a href="#home"> Home </a>
            <a href="#categories"> Categories </a>
            <a href="#about us"> About us </a>
            <a href="#buy"> Buy </a>
            <a href="#contact-us"> Contact Us </a>
        </nav>

        <div id="subTitle">
            <h2>Account creation</h2>
        </div>

        <div id="Sign-Up_Form">
            <form action="submit">
                <div>
                    <label for="title">Select title</label>
                    <select name="title" id="title" required>
                        <option value="miss">Miss</option>
                        <option value="mrs">Mrs</option>
                        <option value="ms">Ms</option>
                        <option value="mr">Mr</option>
                        <option value="mx">Mx</option>
                        <option value="Reverend">Reverend</option>
                        <option value="dr">Dr</option>
                    </select>
                </div>
                
                <div>
                    <label for="firstName">First Name</label>
                    <input type="text" name="First Name" id="fName" placeholder="First name" required>
                </div>
                
                <div>
                    <label for="lastName">Last Name</label>
                    <input type="text" name="Last Name" id="lName" placeholder="Last name" required>
                </div>
                
                <div>
                    <label for="Email">Email</label>
                    <input type="email" name="Email" id="email" placeholder="Example@gmail.com" required>
                </div>
        
                <div>
                    <label for="password">Password</label>
                    <input type="password" name="password" id="pass" placeholder="Password" minlength="8" required>
                </div>
                
                <div>
                    <label for="DOB">Date of Birth</label>
                    <input type="date" name="DOB" id="DOB" required>
                </div>

                <div>
                    <label for="Contact_Num">Contact Number</label>
                    <input type="number" name="contact" id="contact_num" placeholder="(0)-xxxx-xxx-xxx" required>
                </div>

                <div>
                    <label for="house No">House No / name</label>
                    <input type="text" name="house_No" id="house_No" required>
                </div>

                <div>
                    <label for="PostCode">Postcode</label>
                    <input type="text" name="post_code" id="pCode" required>
                </div>

                <div>
                    <button type="submit" id="submitBtn">submit</button>
                </div>

            </form>
        </div>
        
    </body>

</html>
